<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NSE Live Stock Scanner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #07111f;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 20px 15px;
            text-align: center;
            background: #0d1b2d;
            border-bottom: 1px solid #24364d;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .subtitle {
            margin-top: 7px;
            color: #9fb0c5;
            font-size: 13px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            padding: 12px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 13px 8px;
            background: #17283d;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #223b59;
        }

        .scan {
            grid-column: span 2;
            background: #176b46;
        }

        .tabs {
            display: flex;
            overflow-x: auto;
            gap: 7px;
            padding: 0 12px 12px;
        }

        .tabs button {
            white-space: nowrap;
        }

        .active {
            background: #285985;
        }

        #status {
            text-align: center;
            padding: 8px;
            color: #9fb0c5;
            font-size: 13px;
        }

        #stocks {
            padding: 10px 12px 30px;
        }

        .card {
            background: #0d1b2d;
            border: 1px solid #24364d;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .symbol {
            font-size: 20px;
            font-weight: bold;
        }

        .category {
            color: #9fb0c5;
            font-size: 12px;
            margin-top: 3px;
        }

        .signal {
            padding: 7px 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
        }

        .buy {
            background: #145c3d;
            color: #63f0ae;
        }

        .sell {
            background: #682d36;
            color: #ff8e9b;
        }

        .wait {
            background: #51461c;
            color: #f5db70;
        }

        .price {
            font-size: 23px;
            font-weight: bold;
            margin: 12px 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .item {
            background: #111f32;
            border-radius: 8px;
            padding: 9px;
        }

        .label {
            color: #8295ab;
            font-size: 11px;
        }

        .value {
            margin-top: 4px;
            font-weight: bold;
            font-size: 14px;
        }

        .entry {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            background: #162b42;
        }

        .entry-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        .empty {
            text-align: center;
            padding: 35px 15px;
            color: #8ea0b5;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #718398;
            font-size: 11px;
        }

        @media (min-width: 700px) {

            .buttons {
                grid-template-columns: repeat(4, 1fr);
                max-width: 900px;
                margin: auto;
            }

            .scan {
                grid-column: span 4;
            }

            #stocks {
                max-width: 900px;
                margin: auto;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🚀 NSE LIVE STOCK SCANNER</h1>

    <div class="subtitle">
        Momentum + Unusual Volume + Market Cap Scanner
    </div>
</header>


<div class="buttons">

    <button class="scan" onclick="scanAll()">
        🔎 SCAN ALL STOCKS
    </button>

    <button onclick="loadCategory('large')">
        🟢 LARGE CAP
    </button>

    <button onclick="loadCategory('mid')">
        🔵 MID CAP
    </button>

    <button onclick="loadCategory('small')">
        🟠 SMALL CAP
    </button>

    <button onclick="loadCategory('fno')">
        📊 F&O STOCKS
    </button>

    <button onclick="loadCategory('unusual')">
        🔥 UNUSUAL VOLUME
    </button>

</div>


<div class="tabs">

    <button id="tab-large" onclick="loadCategory('large')">
        Large Cap
    </button>

    <button id="tab-mid" onclick="loadCategory('mid')">
        Mid Cap
    </button>

    <button id="tab-small" onclick="loadCategory('small')">
        Small Cap
    </button>

    <button id="tab-fno" onclick="loadCategory('fno')">
        F&O
    </button>

    <button id="tab-unusual" onclick="loadCategory('unusual')">
        Unusual Volume
    </button>

</div>


<div id="status">
    Ready to scan
</div>


<div id="stocks">

    <div class="empty">
        👆 Category select karke scanner start karein
    </div>

</div>


<footer>
    Scanner signals are for analysis only.
    Not guaranteed trading advice.
</footer>


<script>

function setStatus(text) {
    document.getElementById("status").innerText = text;
}


function formatNumber(value) {

    if (value === null || value === undefined) {
        return "-";
    }

    if (typeof value === "number") {
        return value.toFixed(2);
    }

    return value;
}


function stockCard(stock) {

    let signalClass = "wait";

    if (stock.signal === "BUY") {
        signalClass = "buy";
    }

    if (stock.signal === "SELL") {
        signalClass = "sell";
    }

    return `

        <div class="card">

            <div class="top">

                <div>
                    <div class="symbol">
                        ${stock.symbol}
                    </div>

                    <div class="category">
                        ${stock.category || ""}
                        ${stock.fno ? " • F&O" : ""}
                    </div>
                </div>

                <div class="signal ${signalClass}">
                    ${stock.signal}
                </div>

            </div>


            <div class="price">
                ₹${formatNumber(stock.price)}
            </div>


            <div class="grid">

                <div class="item">
                    <div class="label">Momentum</div>
                    <div class="value">
                        ${formatNumber(stock.momentum)}%
                    </div>
                </div>

                <div class="item">
                    <div class="label">Confidence</div>
                    <div class="value">
                        ${formatNumber(stock.confidence)}
                    </div>
                </div>

                <div class="item">
                    <div class="label">RSI</div>
                    <div class="value">
                        ${formatNumber(stock.rsi)}
                    </div>
                </div>

                <div class="item">
                    <div class="label">VWAP</div>
                    <div class="value">
                        ₹${formatNumber(stock.vwap)}
                    </div>
                </div>

                <div class="item">
                    <div class="label">Volume Ratio</div>
                    <div class="value">
                        ${formatNumber(stock.volume_ratio)}x
                    </div>
                </div>

                <div class="item">
                    <div class="label">Unusual Volume</div>
                    <div class="value">
                        ${stock.unusual_volume ? "🔥 YES" : "No"}
                    </div>
                </div>

            </div>


            <div class="entry">

                <div class="entry-row">
                    <span>Entry</span>
                    <strong>
                        ₹${formatNumber(stock.entry)}
                    </strong>
                </div>

                <div class="entry-row">
                    <span>Stop Loss</span>
                    <strong>
                        ${stock.sl !== null
                            ? "₹" + formatNumber(stock.sl)
                            : "-"
                        }
                    </strong>
                </div>

                <div class="entry-row">
                    <span>Target</span>
                    <strong>
                        ${stock.target !== null
                            ? "₹" + formatNumber(stock.target)
                            : "-"
                        }
                    </strong>
                </div>

                <div class="entry-row">
                    <span>Signal Time</span>
                    <strong>
                        ${stock.entry_time || "-"}
                    </strong>
                </div>

            </div>

        </div>

    `;
}


function renderStocks(stocks) {

    const container =
        document.getElementById("stocks");

    if (!stocks || stocks.length === 0) {

        container.innerHTML = `
            <div class="empty">
                😕 Is category mein abhi data nahi mila.
            </div>
        `;

        return;
    }

    container.innerHTML =
        stocks.map(stockCard).join("");
}


async function fetchStocks(url, title) {

    try {

        setStatus(
            "⏳ " + title + " scanning..."
        );

        const response =
            await fetch(url);

        const data =
            await response.json();

        if (!data.success) {

            setStatus(
                "❌ Scanner error"
            );

            return;
        }

        renderStocks(data.stocks || []);

        setStatus(
            "✅ " +
            title +
            " • " +
            (data.stocks || []).length +
            " stocks"
        );

    } catch (error) {

        console.error(error);

        setStatus(
            "❌ Data load error"
        );

        document.getElementById("stocks").innerHTML = `
            <div class="empty">
                Server/data error. Please try again.
            </div>
        `;
    }
}


function loadCategory(category) {

    if (category === "large") {

        fetchStocks(
            "/api/large-cap",
            "Large Cap"
        );

    }

    else if (category === "mid") {

        fetchStocks(
            "/api/mid-cap",
            "Mid Cap"
        );

    }

    else if (category === "small") {

        fetchStocks(
            "/api/small-cap",
            "Small Cap"
        );

    }

    else if (category === "fno") {

        fetchStocks(
            "/api/fno-stocks",
            "F&O"
        );

    }

    else if (category === "unusual") {

        fetchStocks(
            "/api/unusual-volume",
            "Unusual Volume"
        );

    }
}


function scanAll() {

    fetchStocks(
        "/api/scan",
        "All Stocks"
    );

}


window.onload = function() {

    loadCategory("large");

};

</script>

</body>
</html>
